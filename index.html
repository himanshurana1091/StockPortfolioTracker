
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Portfolio Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>Stock Portfolio Tracker</h1>
        <p>Manage your investments in one place</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h3>Total Investment</h3>
                <h2 id="investment">₹0</h2>
            </div>

            <div class="card">
                <h3>Current Value</h3>
                <h2 id="currentValue">₹0</h2>
            </div>

            <div class="card">
                <h3>Profit / Loss</h3>
                <h2 id="profit">₹0</h2>
            </div>

            <div class="card">
                <h3>Total Stocks</h3>
                <h2 id="totalStocks">0</h2>
            </div>

        </section>


        <section class="form-section">

            <h2>Add New Stock</h2>

            <form id="stockForm">

                <input type="text" id="name"
                    placeholder="Company Name" required>

                <input type="text" id="symbol"
                    placeholder="Stock Symbol" required>

                <input type="number" id="quantity"
                    placeholder="Quantity" min="1" required>

                <input type="number" id="buyPrice"
                    placeholder="Buy Price" min="0.01"
                    step="0.01" required>

                <input type="number" id="currentPrice"
                    placeholder="Current Price" min="0.01"
                    step="0.01" required>

                <button type="submit">Add Stock</button>

            </form>

        </section>


        <section class="table-section">

            <h2>My Stock Portfolio</h2>

            <table>

                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Symbol</th>
                        <th>Quantity</th>
                        <th>Buy Price</th>
                        <th>Current Price</th>
                        <th>Investment</th>
                        <th>Profit/Loss</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="stockTable">
                </tbody>

            </table>

        </section>

    </main>

    <script src="/static/script.js"></script>

</body>
</html>
